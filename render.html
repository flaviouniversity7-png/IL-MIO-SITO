        .lightbox-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(30, 32, 34, 0.95);
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        .lightbox-content {
            max-width: 85%;
            max-height: 85%;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: zoomIn 0.3s ease;
            user-select: none;
            -webkit-user-drag: none;
        }
        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 40px;
            color: #ffffff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
            z-index: 10001;
        }
        .lightbox-close:hover {
            color: var(--beige-dark);
        }

        /* STILE FRECCE DI NAVIGAZIONE PER MOUSE */
        .lightbox-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #ffffff;
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
            padding: 15px 25px;
            user-select: none;
            transition: all 0.2s ease;
            z-index: 10000;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        .lightbox-arrow:hover {
            color: var(--beige-dark);
            background-color: rgba(0, 0, 0, 0.5);
        }
        .arrow-left {
            left: 20px;
        }
        .arrow-right {
            right: 20px;
        }

        @keyframes zoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .scheda-nascosta {
            display: none !important;
        }

        @media (max-width: 768px) {
            .lightbox-arrow {
                display: none;
            }
            .lightbox-close {
                top: 20px;

        }

    <div id="lightbox" class="lightbox-modal">

        <span class="lightbox-arrow arrow-left" id="prev-btn">❮</span>
        <img class="lightbox-content" id="lightbox-img" src="" alt="Zoom">
        <span class="lightbox-arrow arrow-right" id="next-btn">❯</span>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.getElementById('close-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        
        let immaginiFiltrate = [];
        let indiceAttuale = 0;

        let touchStartX = 0;
        let touchEndX = 0;
        
        // Supporto zoom nativo
        let zoomAttivo = false;
        let ultimoTocco = 0;

        // Inizializza gli eventi sulle immagini
        document.querySelectorAll('.gallery-img').forEach((img) => {
            img.addEventListener('click', () => {
                const tipoGalleria = img.getAttribute('data-gallery');
                
                // ISOLAMENTO DEI LAVORI: Filtra solo le immagini che appartengono allo stesso gruppo (SALONE, nancy, barbara ecc)
                immaginiFiltrate = Array.from(document.querySelectorAll(`.gallery-img[data-gallery="${tipoGalleria}"]`));
                indiceAttuale = immaginiFiltrate.indexOf(img);
                
                mostraImmagine();
                lightbox.style.display = 'flex';
                resettaZoom(); // Resetta lo zoom all'apertura
            });
        });

        function mostraImmagine() {
            lightboxImg.src = immaginiFiltrate[indiceAttuale].src;
            lightboxImg.alt = immaginiFiltrate[indiceAttuale].alt;
            resettaZoom(); // Resetta lo zoom quando si cambia foto
        }

        function fotoSuccessiva() {
            if (immaginiFiltrate.length === 0) return;
            indiceAttuale = (indiceAttuale + 1) % immaginiFiltrate.length;
            mostraImmagine();
        }

        function fotoPrecedente() {
            if (immaginiFiltrate.length === 0) return;
            indiceAttuale = (indiceAttuale - 1 + immaginiFiltrate.length) % immaginiFiltrate.length;
            mostraImmagine();
        }

        function chiudiLightbox() {
            lightbox.style.display = 'none';
            resettaZoom();
        }

        // Eventi click controlli frecce e chiusura
        closeBtn.addEventListener('click', chiudiLightbox);
        nextBtn.addEventListener('click', (e) => { e.stopPropagation(); fotoSuccessiva(); });
        prevBtn.addEventListener('click', (e) => { e.stopPropagation(); fotoPrecedente(); });
        lightbox.addEventListener('click', chiudiLightbox); 
        lightboxImg.addEventListener('click', (e) => { e.stopPropagation(); }); 

        // Gestione tastiera PC
        document.addEventListener('keydown', (e) => {
            if (lightbox.style.display === 'flex') {
                if (e.key === 'Escape') chiudiLightbox();
                if (e.key === 'ArrowRight') fotoSuccessiva();
                if (e.key === 'ArrowLeft') fotoPrecedente();
            }
        });

 // ================= GESTIONE UNIFICATA TOUCH: SWIPE, PINCH-TO-ZOOM E NAVIGAZIONE DETTAGLI =================
        let scalaCorrente = 1;
        let scalaIniziale = 1;
        let distanzaIniziale = 0;
        
        let posX = 0, posY = 0;
        let startX = 0, startY = 0;
        let isDragging = false;

        lightbox.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                // Gestione Swipe (a un dito) o trascinamento se l'immagine è già zoomata
                touchStartX = e.touches[0].clientX;
                if (scalaCorrente > 1) {
                    isDragging = true;
                    startX = e.touches[0].clientX - posX;
                    startY = e.touches[0].clientY - posY;
                }
            } else if (e.touches.length === 2) {
                // Rilevamento inizio zoom con due dita (Pinch)
                isDragging = false;
                distanzaIniziale = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                scalaIniziale = scalaCorrente;
            }
        }, { passive: true });

        lightbox.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isDragging) {
                // Spostamento fluido nei dettagli della foto quando è ingrandita
                posX = e.touches[0].clientX - startX;
                posY = e.touches[0].clientY - startY;
                applicaTrasformazione();
            } else if (e.touches.length === 2) {
                // Calcolo millimetrico dello zoom in base alla distanza tra le due dita
                const distanzaCorrente = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const fattore = distanzaCorrente / distanzaIniziale;
                // Massimo ingrandimento limitato a 1.5x (non esagerato, mantiene la nitidezza)
                scalaCorrente = Math.min(Math.max(scalaIniziale * fattore, 1), 2.5); 
                applicaTrasformazione();
            }
        }, { passive: true });

        lightbox.addEventListener('touchend', (e) => {
            isDragging = false;
            if (e.touches.length === 0) {
                if (scalaCorrente === 1) {
                    // Se la foto è a dimensione normale, calcola lo swipe laterale
                    touchEndX = e.changedTouches[0].clientX;
                    gestisciSwipe();
                }
            }
        }, { passive: true });

        function gestisciSwipe() {
            const tolleranzaSwipe = 60; 
            if (touchStartX - touchEndX > tolleranzaSwipe) {
                fotoSuccessiva(); // Rimanda alla foto successiva
            }
            if (touchEndX - touchStartX > tolleranzaSwipe) {
                fotoPrecedente(); // Torna alla foto precedente
            }
        }

        function applicaTrasformazione() {
            // Se stringi le dita e torni a 1, azzera i movimenti per non decentrare la foto successiva
            if (scalaCorrente <= 1) {
                scalaCorrente = 1;
                posX = 0;
                posY = 0;
            }
            lightboxImg.style.transform = `translate(${posX}px, ${posY}px) scale(${scalaCorrente})`;
        }

        function resettaZoom() {
            scalaCorrente = 1;
            posX = 0;
            posY = 0;
            applicaTrasformazione();
        }
    </script>
