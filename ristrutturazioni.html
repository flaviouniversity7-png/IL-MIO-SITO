<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perception3D - Ristrutturazioni</title>
    <!-- Collegamento a Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <!-- Foglio di stile unificato del sito -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Intestazione con effetto luce grande -->
    <header>
        <div class="header-content">
            <h1 class="titolo-animato">I NOSTRI LAVORI</h1>
            <p>Seleziona una categoria</p>
        </div>
    </header>

    <main>
        <!-- Griglia ottimizzata con centraggio assoluto delle copertine -->
        <div class="portfolio-section" style="margin-top: 0; border-top: none; padding-top: 0;">
            <div class="projects-grid">
                
                <!-- CARTELLA 1: RENDER -->
                <div class="project-card" style="display: flex; flex-direction: column;">
                    <a href="render.html" style="text-decoration: none; color: inherit; display: block; width: 100%;">
                        <div style="width: 100%; height: 220px; display: flex; justify-content: center; align-items: center; background-color: var(--beige-medium); overflow: hidden;">
                            <!-- MODIFICA QUI: Metti il cursore dentro le virgolette e premi Ctrl + Spazio per scegliere la foto -->
                            <img src="immagini/RENDER VILLETTE TAUNUS/Vista2.3_def.jpg" alt="Render" style="width: 100%; height: 100%; object-fit: cover; display: block;">
                        </div>
                        <div class="project-info">
                            <h5>Render</h5>
                        </div>
                    </a>
                </div>

                <!-- CARTELLA 2: PRIMA E DOPO -->
                <div class="project-card" style="display: flex; flex-direction: column;">
                    <a href="prima-e-dopo.html" style="text-decoration: none; color: inherit; display: block; width: 100%;">
                        <div style="width: 100%; height: 220px; display: flex; justify-content: center; align-items: center; background-color: var(--beige-medium); overflow: hidden;">
                            <!-- MODIFICA QUI: Metti il cursore dentro le virgolette e premi Ctrl + Spazio per scegliere la foto -->
                            <img src="immagini/PRIMA E DOPO/prima e dopo 2.jpg" alt="Prima e Dopo" style="width: 100%; height: 100%; object-fit: cover; display: block;">
                        </div>
                        <div class="project-info">
                            <h5>Prima e Dopo</h5>
                        </div>
                    </a>
                </div>

            </div>
        </div>

        <!-- TASTO DI RITORNO UNIFICATO BEIGE -->
        <section style="text-align: center; margin-top: 50px;">
            <a href="portfolio.html" class="btn-back">&larr; Torna al Portfolio</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Perception3D. Tutti i diritti riservati.</p>
    </footer>
</body>
</html>
