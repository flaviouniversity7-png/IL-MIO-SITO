<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perception3D - Invia un Messaggio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-contatti">

    <header class="header-contatti">
        <h1>Perception3D</h1>
        <p>Nuovo Messaggio</p>
    </header>

    <main class="full-screen-main">
        
        <!-- Barra di controllo superiore (Annulla) -->
        <div class="top-action-bar">
            <a href="index.html" class="btn-back">&larr; Annulla e torna alla Home</a>
        </div>

        <!-- SCHEDA MODULO -->
        <div class="gmail-style-box">
            <form id="modulo-contatti" action="#" method="POST">
                
                <div class="inline-field-group">
                    <input type="text" id="nome" name="nome" required placeholder="Nome *">
                </div>

                <div class="inline-field-group">
                    <input type="text" id="cognome" name="cognome" required placeholder="Cognome *">
                </div>

                <div class="inline-field-group">
                    <input type="email" id="email" name="email" required placeholder="Indirizzo Email *">
                </div>

                <div class="inline-field-group">
                    <input type="tel" id="telefono" name="telefono" required placeholder="Numero di Telefono *">
                </div>

                <div class="textarea-full-group">
                    <textarea id="messaggio" name="messaggio" placeholder="Scrivi qui i dettagli del lavoro, le tue idee o le specifiche tecniche..."></textarea>
                </div>

                <div class="bottom-action-bar">
                    <button type="submit" class="btn-portfolio btn-invia">Invia Richiesta</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 - Perception3D. Tutti i diritti riservati.</p>
    </footer>

    <script>
        document.getElementById('modulo-contatti').addEventListener('submit', function(e) {
            e.preventDefault();

            const datiContatto = {
                nome: document.getElementById('nome').value,
                cognome: document.getElementById('cognome').value,
                email: document.getElementById('email').value,
                telefono: document.getElementById('telefono').value,
                messaggio: document.getElementById('messaggio').value
            };

            fetch('https://hook.eu1.make.com/ubi1467l4t757t9i6q86wqfnxsogm3za', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(datiContatto)
            })
            .then(response => {
                if (response.ok) {
                    alert('Richiesta inviata con successo! Riceverai a breve una mail di conferma.');
                    document.getElementById('modulo-contatti').reset();
                } else {
                    alert('Si è verificato un errore durante l\'invio. Riprova più tardi.');
                }
            })
            .catch(error => {
                console.error('Errore:', error);
                alert('Errore di connessione. Verifica di essere connesso a Internet.');
            });
        });
    </script>
</body>
</html>
